<h1>Créer un compte</h1>
<p>Un même compte permet de chercher un logement et d’en proposer.</p>
<form class="stack" [formGroup]="form" (ngSubmit)="submit()">
  <input formControlName="first_name" placeholder="Prénom"><input formControlName="last_name" placeholder="Nom">
  <input formControlName="email" type="email" placeholder="E-mail"><input formControlName="password" type="password" placeholder="Mot de passe (8 caractères min.)">
  <button [disabled]="form.invalid || busy()">Créer mon compte</button>
</form>

<div class="role-choice">
  <label><input type="radio" formControlName="role" value="SEEKER"> Je cherche un logement</label>
  <label><input type="radio" formControlName="role" value="OWNER"> Je suis propriétaire</label>
</div>
