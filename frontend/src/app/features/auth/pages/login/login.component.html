<h1>Se connecter</h1>
<form class="stack" [formGroup]="form" (ngSubmit)="submit()">
  <input formControlName="email" type="email" placeholder="E-mail" autocomplete="email">
  <input formControlName="password" type="password" placeholder="Mot de passe" autocomplete="current-password">
  <button [disabled]="form.invalid || busy()">Se connecter</button>
  <a routerLink="/auth/register">Pas encore de compte ? Créer un compte</a>
</form>
